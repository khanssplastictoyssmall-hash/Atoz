<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AtoZ Admin</title><link rel="stylesheet" href="/styles.css"></head><body>
<main style="max-width:1200px;margin:auto;padding:25px"><h1>🛠️ AtoZ Toys — Admin Panel</h1><div id="login" class="dialog" style="display:block"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="pw" type="password" placeholder="Password"><button class="cta" onclick="login()">Login</button><p id="err"></p></div>
<div id="panel" style="display:none"><div class="sectionhead"><h2>Store Controls</h2><button onclick="logout()">Logout</button></div>
<div id="settingsBox" class="dialog" style="display:block"></div><hr>
<h2>Products</h2><button class="cta" onclick="newProduct()">+ Add Product</button><div id="productsBox"></div><h2>Categories & Sub-categories</h2><button class="cta" onclick="newCat()">+ Add Category</button><div id="catsBox"></div><h2>Ads / Posters / Banners</h2><button class="cta" onclick="newAd()">+ Add Advertisement</button><div id="adsBox"></div></div></main><script src="/admin.js"></script></body></html>
